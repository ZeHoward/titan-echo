name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test reference import policies
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npx tsc --noEmit
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static game
        run: npm run build:static
        env:
          VITE_PAGES_MODE: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
